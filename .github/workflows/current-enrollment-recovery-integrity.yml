name: Current Enrollment, Class Correction and Receipt Recovery

on:
  pull_request:
    paths:
      - "apps/web/src/app/api/secretaria/alunos/**/matricula-corrente/**"
      - "apps/web/src/app/api/secretaria/recibos/consultar/**"
      - "apps/web/src/components/aluno/CurrentYearEnrollmentPanel.tsx"
      - "apps/web/src/components/aluno/RetificarMatriculaAction.tsx"
      - "apps/web/src/components/aluno/AlunoPerfilPage.tsx"
      - "apps/web/src/components/secretaria/command-center/CommandCenterStudentDossier.tsx"
      - "apps/web/src/components/secretaria/ModalPagamentoRapido.tsx"
      - "apps/web/src/lib/financeiro/recover-receipt-after-payment.ts"
      - "apps/web/tests/unit/current-year-enrollment-and-receipt-recovery.spec.ts"
      - "apps/web/tests/unit/class-rectification-tuition-repricing.spec.ts"
      - "apps/web/tests/unit/class-rectification-primary-first-cycle.spec.ts"
      - "apps/web/src/lib/secretaria/class-rectification-target.ts"
      - "apps/web/src/components/secretaria/TransferForm.tsx"
      - "apps/web/src/components/secretaria/BalcaoEnrollmentCorrection.tsx"
      - "apps/web/src/app/api/secretaria/matriculas/**/rectify-class/**"
      - "supabase/migrations/20271116090000_balcao_retificacao_classe_repreco_pendentes.sql"
      - "supabase/ops/tests/class_rectification_tuition_repricing.sql"
      - "scripts/ci/guard-fiscal-scope.mjs"
      - "scripts/ci/tests/guard-fiscal-scope.spec.mjs"
      - ".github/workflows/current-enrollment-recovery-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Current-year confirmation and read-only receipt recovery
        run: node --test --import tsx apps/web/tests/unit/current-year-enrollment-and-receipt-recovery.spec.ts
      - name: Existing transactional class-correction guard regression
        run: node scripts/ci/class-rectification-contract.mjs
      - name: Class correction tuition repricing regression
        run: node --test --import tsx apps/web/tests/unit/class-rectification-tuition-repricing.spec.ts
      - name: Primary 6th to Secondary 7th class correction
        run: node --test --import tsx apps/web/tests/unit/class-rectification-primary-first-cycle.spec.ts
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: pnpm -C apps/web typecheck
      - name: Targeted ESLint
        run: |
          pnpm -C apps/web exec eslint \
            'src/app/api/secretaria/alunos/[id]/matricula-corrente/route.ts' \
            src/app/api/secretaria/recibos/consultar/route.ts \
            src/components/aluno/CurrentYearEnrollmentPanel.tsx \
            src/components/aluno/RetificarMatriculaAction.tsx \
            src/components/aluno/AlunoPerfilPage.tsx \
            src/components/secretaria/command-center/CommandCenterStudentDossier.tsx \
            src/components/secretaria/ModalPagamentoRapido.tsx \
            src/lib/financeiro/recover-receipt-after-payment.ts \
            tests/unit/current-year-enrollment-and-receipt-recovery.spec.ts \
            --max-warnings 10000
      - name: Keep fiscal/AGT disabled; permit audited student lifecycle SQL only
        run: |
          git diff --check
          node --test scripts/ci/tests/guard-fiscal-scope.spec.mjs
          node scripts/ci/guard-fiscal-scope.mjs "origin/${{ github.base_ref }}"
          node scripts/ci/lifecycle-migration-order.mjs

  class-tuition-postgres:
    name: Atomic class tuition correction — PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klasse_reprice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klasse_reprice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client is installed
        run: psql --version
      - name: Retification, new tuition, settled payments, RLS and rollback
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:5432/klasse_reprice
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/ops/tests/class_rectification_tuition_repricing.sql
