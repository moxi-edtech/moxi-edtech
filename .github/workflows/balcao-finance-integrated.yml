# Disposable end-to-end financial/RLS validation. No remote Supabase credentials.
name: Balcao Full Financial Integration
on:
  pull_request:
    paths:
      - "supabase/ops/tests/balcao_finance_full_*"
      - ".github/workflows/balcao-finance-integrated.yml"
      - "apps/web/src/components/secretaria/BalcaoAtendimento.tsx"
      - "apps/web/src/components/secretaria/command-center/**"
      - "apps/web/src/features/financeiro/actions.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-migration-finance:
    name: Full Supabase migration chain and actual financial RLS
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Stage test-only historical DDL compatibility (ephemeral runner)
        run: |
          # The unmodified 20260202011000 backfill references aluno_id before
          # an ADD COLUMN migration. Preserve all originals and make the
          # precondition explicit without changing production migrations.
          cp supabase/ops/tests/balcao_full_ci_compat_aluno_id.sql supabase/migrations/20260202010999_ci_only_compat_aluno_id.sql
          # Historical trigger ends with $function$ but opens with $$.
          # Fix only its delimiter in the CI runner's *copy*, preserving the
          # original PL/pgSQL body. Zero production migration changes.
          python3 - <<'PYCI'
          from pathlib import Path
          path=Path('supabase/migrations/20260203000015_refactor_gerar_mensalidades_trigger.sql')
          text=path.read_text()
          assert text.count('AS $$') == 1 and text.count('$function$;') == 1
          path.write_text(text.replace('AS $$','AS $function$',1))
          PYCI
          python3 - <<'PYCI'
          from pathlib import Path
          path=Path('supabase/migrations/20260203000024_rpc_realizar_pagamento_balcao.sql')
          text=path.read_text()
          anchor="  v_lancamentos_ids uuid[] := '{}';"
          assert text.count(anchor)==1 and 'INTO v_lancamento_id' in text
          path.write_text(text.replace(anchor, '  v_lancamento_id uuid;\n'+anchor,1))
          PYCI
      - name: Start disposable Supabase with ALL original migrations
        run: |
          supabase start --exclude studio,mailpit,storage-api,imgproxy,logflare,vector,edge-runtime,realtime,supavisor,postgres-meta
      - name: Prove all original migrations PLUS recorded CI-only precondition were applied
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          expected=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          applied=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c 'select count(*) from supabase_migrations.schema_migrations')
          echo "All local migrations: expected=$expected applied=$applied"
          [ "$applied" -ge "$expected" ] || { echo "Migration chain incomplete: cannot claim RLS integration"; exit 1; }
      - name: Real RLS and monthly payment/proof/approval/rejection/retry/receipt/balance
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_finance_full_migrations.sql
      - name: Two independent real PostgreSQL sessions compete to validate same payment
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash supabase/ops/tests/balcao_finance_full_concurrency.sh
      - name: Confirm zero paid branch or remote deployment
        run: |
          echo "Tests used only self-hosted ephemeral Postgres, source migrations and synthetic IDs."
