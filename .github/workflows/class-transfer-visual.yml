name: Class Transfer Visual Evidence
on:
  pull_request:
    paths:
      - 'apps/web/src/components/secretaria/TransferForm.tsx'
      - 'apps/web/visual-harness/main.tsx'
      - 'apps/web/scripts/visual/class-transfer-screenshot.mjs'
      - '.github/workflows/class-transfer-visual.yml'
permissions:
  contents: read
jobs:
  synthetic-transfer-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser tools
        run: |
          mkdir -p /tmp/klasse-visual
          npm --prefix /tmp/klasse-visual install --no-save @playwright/test@1.57.0 vite@6.4.0
          /tmp/klasse-visual/node_modules/.bin/playwright install --with-deps chromium
      - name: Start synthetic fixture
        run: |
          /tmp/klasse-visual/node_modules/.bin/vite --config apps/web/visual-harness/vite.config.mjs --host 127.0.0.1 --port 6006 > /tmp/klasse-visual.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:6006/ >/dev/null && exit 0; sleep 2; done
          tail -n 80 /tmp/klasse-visual.log; exit 1
      - name: Capture five viewports at three zoom levels
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/class-transfer-screenshot.mjs
      - name: Browser diagnostics
        if: failure()
        run: tail -n 100 /tmp/klasse-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-transfer-synthetic-screenshots
          path: apps/web/visual-evidence/class-transfer/
          if-no-files-found: error
