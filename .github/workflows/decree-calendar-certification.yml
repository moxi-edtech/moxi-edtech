name: MED Decree Calendar Consumer Contracts

on:
  pull_request:
    paths:
      - "apps/web/src/app/api/aluno/home/academic-events/**"
      - "apps/web/src/app/api/professor/calendario/**"
      - "apps/web/src/app/api/secretaria/calendario/**"
      - "apps/web/src/app/api/secretaria/admissoes/convert/**"
      - "apps/web/src/app/api/secretaria/operacoes-academicas/**"
      - "apps/web/src/app/api/escola/**/periodos-*/**"
      - "apps/web/src/app/api/escola/**/calendario/**"
      - "apps/web/src/lib/academic-calendar/**"
      - "apps/web/tests/unit/decree-calendar-sync-health.spec.ts"
      - "supabase/migrations/*official_decree*"
      - "supabase/migrations/*calendar_provenance*"
      - ".github/workflows/decree-calendar-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-contracts:
    name: Academic calendar consistency, auth and year isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run decree calendar synchronization tests
        working-directory: apps/web
        run: node --test --import tsx tests/unit/decree-calendar-sync-health.spec.ts
      - name: Validate affected Next.js TypeScript routes
        run: pnpm -C apps/web typecheck
