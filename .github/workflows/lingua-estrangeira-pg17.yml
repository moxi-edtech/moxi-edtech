name: Língua Estrangeira · PostgreSQL 17
on:
  pull_request:
    paths:
      - 'supabase/ops/lingua_estrangeira_config.proposed.sql'
      - 'supabase/ops/tests/lingua_estrangeira_*'
      - 'apps/web/src/lib/academico/lingua-estrangeira.ts'
      - 'apps/web/src/components/escola/settings/_components/ForeignLanguageConfig.tsx'
      - 'apps/web/src/components/escola/settings/_components/DisciplinaModal.tsx'
      - 'apps/web/src/app/api/escolas/**/disciplinas/lingua-estrangeira/**'
      - 'apps/web/tests/unit/lingua-estrangeira.spec.ts'
      - '.github/workflows/lingua-estrangeira-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  db:
    name: PostgreSQL 17 · permissões e dados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: lingua_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingua_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-test
      PGDATABASE: lingua_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Testar contrato em banco descartável
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = lingua_ci
          psql -X -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num' | grep '^17'
          psql -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/lingua_estrangeira_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/ops/lingua_estrangeira_config.proposed.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/lingua_estrangeira_assert.sql
  web:
    name: Interface · testes e TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testar escolhas de idioma
        working-directory: apps/web
        run: node --test --import tsx tests/unit/lingua-estrangeira.spec.ts
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -C apps/web typecheck

  migration-candidate:
    name: Gerar migração forward-only via CLI (sem deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Observado no ledger de produção em 26/11/2026. Revalidar antes de aplicar.
      OBSERVED_REMOTE_MAX: '20271204030000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar ficheiro candidato local, sem credenciais ou ligação remota
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          artifact="$RUNNER_TEMP/lingua-migration"
          mkdir -p "$artifact"
          cd "$scratch"
          npm exec --yes --package=supabase@2.122.0 -- supabase --version
          npm exec --yes --package=supabase@2.122.0 -- supabase migration new lingua_estrangeira_config
          shopt -s nullglob
          generated=(supabase/migrations/*_lingua_estrangeira_config.sql)
          test "${#generated[@]}" -eq 1
          test ! -s "${generated[0]}"
          cli_filename="$(basename "${generated[0]}")"
          cp "$GITHUB_WORKSPACE/supabase/ops/lingua_estrangeira_config.proposed.sql" "${generated[0]}"
          cd "$GITHUB_WORKSPACE"
          export CLI_FILENAME="$cli_filename"
          version="$(node --input-type=module <<'JS'
          import { readdirSync } from 'node:fs';
          const entries = readdirSync('supabase/migrations');
          const local = entries.map(x => /^(\d{14})_/.exec(x)?.[1]).filter(Boolean).sort().at(-1);
          const remote = process.env.OBSERVED_REMOTE_MAX;
          if (!local || !/^\d{14}$/.test(remote)) throw Error('Missing ledger floor');
          const floor = [local, remote].sort().at(-1);
          const [y,m,d,h,min,sec] = floor.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/).slice(1).map(Number);
          const stamp = new Date(Date.UTC(y,m-1,d,h,min,sec));
          const encode = date => date.toISOString().slice(0,19).replace(/\D/g,'');
          if (encode(stamp) !== floor) throw Error('Invalid latest migration version');
          stamp.setUTCMinutes(stamp.getUTCMinutes()+1);
          const next = encode(stamp);
          if (next <= floor || entries.some(x=>x.startsWith(next+'_'))) throw Error('Migration collision');
          console.log(next);
          JS
          )"
          name="${version}_lingua_estrangeira_config.sql"
          cp "$scratch/${generated[0]}" "$artifact/$name"
          cp "$artifact/$name" "supabase/migrations/$name"
          cmp "supabase/migrations/$name" supabase/ops/lingua_estrangeira_config.proposed.sql
          node scripts/ci/check-supabase-migration-ledger.mjs
          printf 'CLI filename: %s\nForward-only candidate: %s\nObserved remote max: %s\n' "$CLI_FILENAME" "$name" "$OBSERVED_REMOTE_MAX" | tee "$artifact/provenance.txt"
          sha256sum "$artifact/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-estrangeira-migration-candidate
          path: ${{ runner.temp }}/lingua-migration/
          if-no-files-found: error
          retention-days: 14
