name: Exportação de listas nominais — regressão

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/documentos/listaNominal*'
      - 'apps/web/src/lib/documentos/nominalA4.ts'
      - 'apps/web/src/lib/documentos/rosterSensitivePermission.ts'
      - 'apps/web/tests/fixtures/roster-pdf-*'
      - 'apps/web/tests/fixtures/verify-roster-pdfs.py'
      - 'apps/web/src/lib/pdf/**'
      - 'apps/web/src/app/api/secretaria/turmas/**'
      - 'apps/web/src/app/api/secretaria/classes/**'
      - 'apps/web/src/app/api/secretaria/documentos-oficiais/lote/**'
      - 'apps/web/src/inngest/functions/pautas-lote.ts'
      - 'apps/web/src/components/secretaria/QuickDocHub.tsx'
      - 'apps/web/src/components/secretaria/TurmaDetailClient.tsx'
      - 'apps/web/src/components/secretaria/TurmasListClient.tsx'
      - 'apps/web/tests/unit/roster-export-*.spec.ts'
      - '.github/workflows/roster-export-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependências fixadas
        run: pnpm install --frozen-lockfile
      - name: Testes de inclusão por sessão e estados
        run: pnpm -C apps/web exec node --import tsx --test tests/unit/roster-export-*.spec.ts tests/unit/current-year-roster-backend.spec.ts
      - name: Instalar ferramentas de inspeção do PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Gerar e validar PDFs sintéticos (55 alunos, sem alunos, campos sensíveis)
        env:
          ROSTER_PDF_OUTPUT: ${{ runner.temp }}/klasse-roster-artifacts
        run: |
          pnpm -C apps/web exec node --import tsx tests/fixtures/roster-pdf-fixture.ts
          python3 apps/web/tests/fixtures/verify-roster-pdfs.py "${ROSTER_PDF_OUTPUT}"
      - name: Anexar páginas dos PDFs de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roster-pdf-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/klasse-roster-artifacts/*
          if-no-files-found: warn
          retention-days: 14
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm -C apps/web typecheck
      - name: Lint
        run: pnpm -C apps/web lint
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Valores sintéticos usados exclusivamente para compilação; sem ligações reais.
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InRlc3QiLCJleHAiOjk5OTk5OTk5OTl9.fixture
        run: pnpm -C apps/web build
