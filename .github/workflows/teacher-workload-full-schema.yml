name: Teacher workload — full Supabase schema
on:
  pull_request:
    paths:
      - 'supabase/migration_drafts/teacher_workload*.sql'
      - 'supabase/migrations/**'
      - '.github/workflows/teacher-workload-full-schema.yml'
permissions:
  contents: read
jobs:
  full-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Prepare isolated project with complete versioned history
        run: |
          set -euo pipefail
          supabase --version
          mkdir -p "$RUNNER_TEMP/klasse-workload"
          cd "$RUNNER_TEMP/klasse-workload"
          supabase init
          mkdir -p supabase/migrations
          sed -i -E 's/^major_version = [0-9]+/major_version = 17/' supabase/config.toml
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          test -s supabase/migrations/20271204034000_teacher_workload_docencia.sql
      - name: Replay complete migration history locally (no seed, no linked project)
        working-directory: ${{ runner.temp }}/klasse-workload
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local --no-seed
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/migration_drafts/teacher_workload_full_schema_checks.sql"
      - name: Stop isolated stack
        if: always()
        working-directory: ${{ runner.temp }}/klasse-workload
        run: supabase stop --no-backup
