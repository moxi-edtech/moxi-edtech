name: Balcao Performance Budgets

on:
  pull_request:
    paths:
      - "apps/web/src/components/secretaria/BalcaoAtendimento.tsx"
      - "apps/web/src/components/secretaria/BalcaoWorkspace.tsx"
      - "apps/web/src/components/secretaria/command-center/**"
      - "apps/web/src/app/secretaria/balcao/**"
      - "apps/web/src/components/layout/klasse/Topbar.tsx"
      - "apps/web/src/components/layout/klasse/AppShell.tsx"
      - "apps/web/visual-harness/**"
      - "apps/web/scripts/performance/**"
      - "docs/performance/**"
      - ".github/workflows/balcao-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-performance:
    name: Synthetic navigation, regressions, production bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install temporary fixture test tools
        run: |
          mkdir -p /tmp/klasse-perf-tools
          npm install --prefix /tmp/klasse-perf-tools --no-save vite@6.4.0 playwright@1.57.0
          /tmp/klasse-perf-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated visual fixture server
        run: |
          /tmp/klasse-perf-tools/node_modules/.bin/vite --config apps/web/visual-harness/vite.config.mjs --host 127.0.0.1 --port 6016 >/tmp/balcao-perf-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:6016/?story=balcao-perf" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/balcao-perf-vite.log
          exit 1
      - name: E2E synthetic drafts, attached document, identity boundaries
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-perf-tools/node_modules/playwright/index.mjs
        run: |
          node apps/web/scripts/performance/balcao-behavior.mjs
          node apps/web/scripts/performance/balcao-history.mjs
          node apps/web/scripts/performance/balcao-route-e2e.mjs
      - name: Repeated navigation benchmark
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-perf-tools/node_modules/playwright/index.mjs
          PERF_ITERATIONS: "5"
          PERF_IDLE_MS: "5000"
          PERF_OUTPUT: /tmp/balcao-ci-report.json
        run: node apps/web/scripts/performance/balcao-benchmark.mjs
      - name: Check request, React commit and JS transfer budgets
        run: node apps/web/scripts/performance/balcao-check-budget.mjs /tmp/balcao-ci-report.json
      - name: Academic/financial/navigation contracts
        run: |
          node --test --import tsx agents/scan/kf2-search-audit.test.ts
          cd apps/web
          node --test --import tsx tests/unit/workspace-student-dossier.spec.tsx tests/unit/balcao-return-context-reconciliation.spec.ts tests/unit/balcao-performance-contract.spec.ts tests/unit/balcao-draft-state.spec.ts
      - name: Typecheck and full eslint
        run: |
          pnpm -C apps/web typecheck
          pnpm -C apps/web lint
      - name: Production Next.js route build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-fixture-key
          SUPABASE_URL: https://fixture.invalid
          SUPABASE_ANON_KEY: synthetic-fixture-key
        run: pnpm -C apps/web build
      - name: Gate production JS bytes
        run: node apps/web/scripts/performance/balcao-check-budget.mjs /tmp/balcao-ci-report.json --with-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balcao-performance-synthetic-only
          path: |
            /tmp/balcao-ci-report.json
            /tmp/balcao-perf-vite.log
          if-no-files-found: warn
          retention-days: 7
