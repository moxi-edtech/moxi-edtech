name: Fecho diário — PostgreSQL 17
on:
  pull_request:
    paths:
      - 'supabase/migrations/*fecho_diario*'
      - 'supabase/ops/tests/*fecho_diario*'
      - 'apps/web/src/**/expediente/**'
      - 'apps/web/src/**/fecho/**'
      - 'apps/web/src/components/secretaria/**'
      - '.github/workflows/fecho-diario-secretaria.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-db:
    name: Execute migrations and daily-close behavioral regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: expediente_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expediente_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-test
      PGDATABASE: expediente_ci
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap synthetic PostgreSQL 17 fixture
        run: |
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = expediente_ci
          psql -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num' | grep '^17'
          psql -v ON_ERROR_STOP=1 -f supabase/ops/tests/bootstrap_fecho_diario_secretaria.sql
      - name: Execute both migrations in separate transactions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271203005000_fecho_diario_event_types.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271203005100_fecho_diario_secretaria.sql
      - name: Privilege and behavioral regression
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/ops/tests/regression_fecho_diario_secretaria.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/tests/behavior_fecho_diario_secretaria.sql
