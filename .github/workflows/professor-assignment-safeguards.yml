name: Professor assignment safeguards

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/professores/**'
      - 'apps/web/src/app/api/escolas/**/professores/**'
      - 'apps/web/src/lib/escola/disciplinas.ts'
      - 'apps/web/src/app/api/escolas/**/professores/**'
      - 'apps/web/tests/unit/professor-assignment-hardening.spec.ts'
      - 'apps/web/tests/unit/turma-modal-assignments.spec.ts'
      - 'apps/web/src/components/secretaria/TurmaAtribuirProfessoresModal.tsx'
      - 'apps/web/src/app/api/secretaria/professores/route.ts'
      - 'apps/web/src/app/api/secretaria/turmas/**/atribuir-professor/route.ts'
      - 'apps/web/src/app/api/secretaria/turmas/**/disciplinas/route.ts'
      - 'apps/web/src/app/api/professor/atribuicoes/route.ts'
      - 'supabase/migrations/2027111711*.sql'
      - 'supabase/migrations/2027111717*.sql'
      - 'supabase/tests/teacher_assignment_disposable_*.sql'
      - 'supabase/migration_drafts/teacher_workload_docencia*.sql'
      - '.github/workflows/professor-assignment-safeguards.yml'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run assignment contract tests
        run: node --test --import tsx apps/web/tests/unit/professor-assignment-hardening.spec.ts apps/web/tests/unit/turma-modal-assignments.spec.ts

  postgres-integration:
    name: Disposable PostgreSQL assignment integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klasse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klasse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: klasse_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations and run authenticated test fixtures on disposable DB
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f supabase/tests/teacher_assignment_disposable_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271117110000_assign_professor_multiplas_turmas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271117111500_professor_assignment_roster_academic_year.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271117172000_trocar_professor_turma_disciplina_atomic.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/teacher_assignment_disposable_cases.sql
      - name: Validate new teacher workload and teaching regimes (PostgreSQL 17)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migration_drafts/teacher_workload_docencia.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migration_drafts/teacher_workload_docencia_cases.sql

  typecheck:
    name: TypeScript web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check Next.js web types
        run: pnpm --filter web typecheck
