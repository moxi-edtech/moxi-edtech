name: Portal Visual Fixture Screenshots
on:
  pull_request:
    paths:
      - 'apps/web/src/components/aluno/PortalVisualFixtures.stories.tsx'
      - 'apps/web/src/components/professor/GradeEntryGrid.tsx'
      - 'apps/web/src/components/portal/ui/PortalDrawerNavigator.tsx'
      - 'apps/web/scripts/visual/grade-concurrency.mjs'
      - 'apps/web/scripts/visual/drawer-history.mjs'
      - 'apps/web/scripts/visual/portais-screenshot.mjs'
      - 'apps/web/scripts/visual/portal-motion-performance.mjs'
      - 'apps/web/scripts/visual/portal-context-sheets.mjs'
      - 'apps/web/src/components/portal/ui/PortalSheet.tsx'
      - 'apps/web/src/components/aluno/financeiro-portal/PaymentDrawer.tsx'
      - 'apps/web/src/components/aluno/layout/ServicePaymentDrawer.tsx'
      - 'apps/web/src/components/portal/motion/**'
      - 'apps/web/src/components/portal/ui/PortalTabs.tsx'
      - 'apps/web/src/components/layout/klasse/PortalBottomNav.tsx'
      - 'apps/web/scripts/visual/theme-switcher-smoke.mjs'
      - 'apps/web/src/components/ThemePreferences.tsx'
      - 'apps/web/src/components/ThemeToggle.tsx'
      - 'apps/web/src/components/providers/ThemeProvider.tsx'
      - 'apps/web/src/app/globals.css'
      - 'apps/web/visual-harness/**'
      - 'apps/web/src/lib/sidebarPresentation.ts'
      - 'apps/web/src/lib/sidebarNav.ts'
      - 'apps/web/src/components/layout/klasse/Sidebar.tsx'
      - 'apps/web/src/components/layout/shared/Sidebar*.tsx'
      - 'apps/web/scripts/visual/sidebar-overflow.mjs'
      - 'apps/web/tests/unit/sidebar-presentation.spec.ts'
      - 'apps/web/src/components/aluno/tabs/TabDocumentos.tsx'
      - 'apps/web/src/components/aluno/tabs/TabNotas.tsx'
      - 'apps/web/src/app/professor/page.tsx'
      - 'apps/web/src/components/aluno/dashboard/**'
      - 'apps/web/src/lib/aluno/dashboardPresentation.ts'
      - 'apps/web/src/lib/aluno/gradesPresentation.ts'
      - 'apps/web/src/components/ui/alert.tsx'
      - 'apps/web/src/components/aluno/home/**'
      - 'apps/web/tests/unit/aluno-notas-editorial.spec.ts'
      - '.github/workflows/portal-visual-fixtures.yml'
permissions:
  contents: read
jobs:
  synthetic-browser-evidence:
    name: 5 viewports x 3 zoom levels x consolidated portal scenarios
    runs-on: ubuntu-24.04 # Playwright 1.57 Chromium is unsupported on ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated visual tools (CI only)
        run: |
          mkdir -p /tmp/klasse-visual
          npm --prefix /tmp/klasse-visual install --no-save @playwright/test@1.57.0 vite@6.4.0
          /tmp/klasse-visual/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Vite for actual React portal components using synthetic API fixtures
        run: |
          /tmp/klasse-visual/node_modules/.bin/vite --config apps/web/visual-harness/vite.config.mjs --host 127.0.0.1 --port 6006 > /tmp/klasse-visual.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:6006/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 90 /tmp/klasse-visual.log
          exit 1
      - name: Validate Vite transformed React entry
        run: |
          curl --fail-with-body --silent --show-error http://127.0.0.1:6006/main.tsx -o /tmp/klasse-main-built.js || { tail -n 70 /tmp/klasse-visual.log; exit 1; }
      - name: Test editorial dashboard scenarios
        run: node --test --import tsx apps/web/tests/unit/aluno-dashboard-editorial.spec.ts
      - name: Test editorial grades and payment access
        run: node --test --import tsx apps/web/tests/unit/aluno-notas-editorial.spec.ts
      - name: Browser test for light/dark/system (synthetic)
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/theme-switcher-smoke.mjs
      - name: Motion interaction and CPU baseline (1x and 4x)
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/portal-motion-performance.mjs
      - name: Contextual sheets and explicit payment confirmation
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/portal-context-sheets.mjs
      - name: Grade autosave and manual retry in both numeric scales
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/grade-concurrency.mjs
      - name: Drawer history, guards, school scope and multiple roots
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/drawer-history.mjs
      - name: Sidebar geometry and label contract
        run: node --test --import tsx apps/web/tests/unit/sidebar-presentation.spec.ts
      - name: Sidebar overflow matrix (synthetic)
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/sidebar-overflow.mjs
      - name: Capture synthetic responsive/zoom matrix
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/portais-screenshot.mjs
      - name: Vite diagnostics on failure
        if: failure()
        run: tail -n 130 /tmp/klasse-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-visual-fixtures-synthetic
          path: apps/web/visual-evidence/
          retention-days: 7
          if-no-files-found: warn
