name: Portal Visual Fixture Screenshots
on:
  pull_request:
    paths:
      - 'apps/web/src/components/aluno/PortalVisualFixtures.stories.tsx'
      - 'apps/web/scripts/visual/portais-screenshot.mjs'
      - 'apps/web/src/components/aluno/tabs/TabDocumentos.tsx'
      - 'apps/web/src/components/aluno/tabs/TabNotas.tsx'
      - 'apps/web/src/app/professor/page.tsx'
      - '.github/workflows/portal-visual-fixtures.yml'
permissions:
  contents: read
jobs:
  synthetic-browser-evidence:
    name: 5 viewports x 3 zoom levels x 4 actual portal components
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-only-not-a-real-credential
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook with synthetic fixtures
        run: pnpm -C apps/web exec storybook build --output-dir storybook-static
      - name: Install isolated Playwright runner (not a production dependency)
        run: |
          mkdir -p /tmp/klasse-visual
          npm --prefix /tmp/klasse-visual install --no-save @playwright/test@1.57.0
          /tmp/klasse-visual/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Storybook locally
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory apps/web/storybook-static > /tmp/klasse-storybook.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6006/iframe.html >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Storybook preview not available"
          exit 1
      - name: Capture five resolutions at three zooms, no production data
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-visual/node_modules/playwright/index.mjs
        run: node apps/web/scripts/visual/portais-screenshot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-visual-fixtures-synthetic
          path: apps/web/visual-evidence/
          retention-days: 7
          if-no-files-found: warn
