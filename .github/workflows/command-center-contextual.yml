name: Command Center Contextual

on:
  pull_request:
    paths:
      - 'apps/web/src/components/CommandPalette.tsx'
      - 'apps/web/src/components/secretaria/command-center/**'
      - 'apps/web/src/lib/command-center/**'
      - 'apps/web/src/hooks/useCourseContext.ts'
      - 'apps/web/src/app/api/escolas/**/command-center/**'
      - 'apps/web/tests/unit/command-center-contextual.spec.ts'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - 'supabase/migrations/*command_center_course_overview.sql'
      - 'supabase/ops/tests/regression_command_center_course_overview.sql'
      - '.github/workflows/command-center-contextual.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/src/components/CommandPalette.tsx'
      - 'apps/web/src/components/secretaria/command-center/**'
      - 'apps/web/src/lib/command-center/**'
      - 'apps/web/src/hooks/useCourseContext.ts'
      - 'apps/web/src/app/api/escolas/**/command-center/**'
      - 'apps/web/tests/unit/command-center-contextual.spec.ts'
      - 'supabase/migrations/*command_center_course_overview.sql'
      - 'supabase/ops/tests/regression_command_center_course_overview.sql'

permissions:
  contents: read

jobs:
  web-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contextual modal unit contracts
        run: pnpm -C apps/web exec tsx --test tests/unit/command-center-contextual.spec.ts
      - name: Typecheck
        run: pnpm -C apps/web typecheck
      - name: Focused ESLint
        run: |
          pnpm -C apps/web exec eslint \
            src/components/CommandPalette.tsx \
            src/components/secretaria/command-center/CourseContextView.tsx \
            src/hooks/useCourseContext.ts \
            src/lib/command-center/entity-context.ts \
            "src/app/api/escolas/[id]/command-center/cursos/[cursoId]/route.ts" \
            tests/unit/command-center-contextual.spec.ts --max-warnings 0

  database-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration to disposable database and test invariants
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/ops/tests/regression_command_center_course_overview.sql
