name: KF2 Search Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kf2-search-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: KF2 Path Filter Regression Tests
        run: node --test scripts/kf2-path-filter.test.mjs

      - name: KLASSE UI Standards Regression Tests
        run: node --test scripts/check-klasse-ui-standards.test.mjs

      - name: Detect KF2-relevant changes
        id: changes
        run: node scripts/kf2-path-filter.mjs

      - name: Skip unrelated monorepo changes
        if: steps.changes.outputs.run != 'true'
        run: echo "KF2 heavy gates skipped — no KF2-relevant files changed."

      - name: Setup pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: KLASSE UI Standards
        if: steps.changes.outputs.run == 'true'
        env:
          # One-time alignment baseline: preserve the exact pre-alignment product branch state.
          KLASSE_UI_BASE_REF: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/main-alignment-20260929' && '42df91e23caf491255527bb009023ec74b042f2f' || '' }}
        run: pnpm check:ui-standards

      - name: Security Regression Tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm test:security

      - name: KF2 Auditor Regression Tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec tsx --test agents/scan/kf2-search-audit.test.ts

      - name: KF2 Search Audit
        if: steps.changes.outputs.run == 'true'
        run: pnpm agent:kf2

      - name: Codex Scan
        if: steps.changes.outputs.run == 'true'
        run: pnpm agent:scan

      - name: Performance Gate
        if: steps.changes.outputs.run == 'true'
        run: pnpm agents:gate
