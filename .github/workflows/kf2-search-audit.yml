name: KF2 Search Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kf2-search-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: KF2 Path Filter Regression Tests
        run: node --test scripts/kf2-path-filter.test.mjs

      - name: KLASSE UI Standards Regression Tests
        run: node --test scripts/check-klasse-ui-standards.test.mjs

      - name: Detect KF2-relevant changes
        id: changes
        run: node scripts/kf2-path-filter.mjs

      - name: Skip unrelated monorepo changes
        if: steps.changes.outputs.run != 'true'
        run: echo "KF2 heavy gates skipped — no KF2-relevant files changed."

      - name: Setup pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: WhatsApp Sales Agent Regression Tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm -C services/whatsapp-sales-agent test

      - name: KLASSE UI Standards
        if: steps.changes.outputs.run == 'true'
        env:
          # One-time alignment baseline: preserve the exact pre-alignment product branch state.
          KLASSE_UI_BASE_REF: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/main-alignment-20260929' && '42df91e23caf491255527bb009023ec74b042f2f' || '' }}
        run: pnpm check:ui-standards

      - name: Security Regression Tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm test:security

      - name: KF2 Auditor Regression Tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec tsx --test agents/scan/kf2-search-audit.test.ts

      - name: KF2 Search Audit
        if: steps.changes.outputs.run == 'true'
        run: pnpm agent:kf2

      - name: Codex Scan
        if: steps.changes.outputs.run == 'true'
        run: pnpm agent:scan

      - name: Performance Gate
        if: steps.changes.outputs.run == 'true'
        run: pnpm agents:gate


  # Permanent read-only fiscal/migration gates (introduced by PR #182).
  fiscal-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Permanent BILL-001/002/003/009, SAF-T and ledger negative tests
        working-directory: apps/web
        run: node --test --import tsx tests/unit/fiscal-immutability-guards.spec.ts
      - name: Verify no gap in the captured production migration versions
        run: python3 scripts/check-migration-inventory.py

  fiscal-guard-disposable:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Fiscal guard migration on clean PostgreSQL 17, twice (idempotency)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/fiscal_guard_convergence_pg17.sql
      - name: Attempt ordered whole-main replay on separate disposable database
        run: |
          createdb migration_replay_probe
          PGDATABASE=migration_replay_probe python3 scripts/probe-clean-migration-replay.py
          echo "::notice::Schema parity remains gated on the full Supabase PG17 extension runtime and read-only schema dump access."
      - name: Schema-only pg_dump parity (gated; never writes production)
        env:
          KLASSE_PROD_READONLY_DB_URL: ${{ secrets.KLASSE_PROD_READONLY_DB_URL }}
          KLASSE_DISPOSABLE_DB_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/migration_replay_probe
        run: |
          if [ -f /tmp/klasse-full-replay-green ] && [ -n "$KLASSE_PROD_READONLY_DB_URL" ]; then
            bash scripts/compare-schema-only-gated.sh
          else
            echo "::warning::BLOCKED: full main replay / read-only production pg_dump prerequisites missing; no parity claimed"
          fi
