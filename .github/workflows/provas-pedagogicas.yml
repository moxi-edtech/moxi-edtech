name: Provas pedagógicas — segurança e impressão
on:
  pull_request:
    paths:
      - 'supabase/migrations/*_provas_pedagogicas.sql'
      - 'supabase/tests/provas_pedagogicas_*'
      - 'apps/web/src/lib/provas/**'
      - 'apps/web/src/components/provas/**'
      - 'apps/web/src/app/api/escola/**/provas/**'
      - 'apps/web/tests/unit/provas-print.spec.mjs'
      - 'apps/web/tests/browser/provas-print.mjs'
      - 'apps/web/tests/browser/provas-mobile.mjs'
      - 'apps/web/tests/browser/provas-distribuicao.mjs'
      - 'apps/web/visual-harness/provas*'
      - 'apps/web/src/components/ui/ModalShell.tsx'
      - 'apps/web/src/app/escola/**/professor/provas/**'
      - 'apps/web/src/app/escola/**/secretaria/**/provas/**'
      - 'apps/web/src/app/escola/**/operacoes/provas/**'
      - 'apps/web/src/lib/sidebarNav.ts'
      - 'apps/web/src/lib/professorNav.ts'
      - 'apps/web/src/app/professor/page.tsx'
      - 'apps/web/src/app/secretaria/(portal-secretaria)/Dashboard.tsx'
      - 'apps/web/src/components/layout/escola-admin/QuickActionsSection.tsx'
      - 'scripts/audit-provas-dependencies.mjs'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/provas-pedagogicas.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: provas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: provas_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated fixture and real migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/provas_pedagogicas_isolated_setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271204001000_provas_pedagogicas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271204021000_provas_pedagogicas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271204022000_provas_pedagogicas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20271204023000_provas_pedagogicas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/provas_pedagogicas_isolated_test.sql
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsx --test apps/web/tests/unit/provas-print.spec.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit new editor dependency graph
        run: |
          pnpm --filter web list --prod --depth Infinity --json > /tmp/provas-deps.json
          set +e
          pnpm audit --prod --json > /tmp/provas-audit.json
          audit_exit=$?
          set -e
          node scripts/audit-provas-dependencies.mjs /tmp/provas-deps.json /tmp/provas-audit.json "$audit_exit"

  browser-print:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated browser tools (CI only)
        run: |
          mkdir -p /tmp/klasse-provas-browser
          npm --prefix /tmp/klasse-provas-browser install --no-save --ignore-scripts @playwright/test@1.57.0 vite@6.4.0
          /tmp/klasse-provas-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Install PDF bounds verifier (CI only)
        run: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: A4 document and MathML browser smoke
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-provas-browser/node_modules/playwright/index.mjs
        run: pnpm exec tsx apps/web/tests/browser/provas-print.mjs
      - name: Start real React component fixture (no production data)
        run: |
          /tmp/klasse-provas-browser/node_modules/.bin/vite --config apps/web/visual-harness/vite.config.mjs --host 127.0.0.1 --port 6006 > /tmp/klasse-provas-vite.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:6006/provas.html >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 100 /tmp/klasse-provas-vite.log
          exit 1
      - name: Mobile teacher flow and accessible input smoke
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-provas-browser/node_modules/playwright/index.mjs
        run: node apps/web/tests/browser/provas-mobile.mjs
      - name: WebKit mobile formula and model smoke (Safari engine)
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-provas-browser/node_modules/playwright/index.mjs
          PROVAS_BROWSER: webkit
        run: node apps/web/tests/browser/provas-mobile.mjs
      - name: Secretary distribution smoke
        env:
          PLAYWRIGHT_MODULE: /tmp/klasse-provas-browser/node_modules/playwright/index.mjs
        run: node apps/web/tests/browser/provas-distribuicao.mjs
      - name: Vite diagnostics
        if: failure()
        run: tail -n 100 /tmp/klasse-provas-vite.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provas-browser-synthetic
          path: apps/web/visual-evidence/provas/
          retention-days: 7
          if-no-files-found: warn
