name: KLASSE Portal Consolidation
on:
  pull_request:
    paths:
      - 'apps/web/src/components/aluno/**'
      - 'apps/web/src/lib/aluno/**'
      - 'apps/web/src/app/api/aluno/dashboard/route.ts'
      - 'apps/web/src/app/crm/proposta/preview/page.tsx'
      - 'apps/web/tests/unit/**'
      - '.github/workflows/klasse-portal-consolidation.yml'
permissions:
  contents: read
jobs:
  full-unit-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: All web unit specs (no exclusions or skips)
        working-directory: apps/web
        shell: bash
        run: |
          mapfile -t suites < <(find tests/unit -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.mjs' \) | sort)
          printf 'Executing %s unit suites with synthetic test data\n' "${#suites[@]}"
          test "${#suites[@]}" -gt 0
          node --test --import tsx "${suites[@]}"
  targeted-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Financial academic and tenant-role regressions
        working-directory: apps/web
        run: |
          node --test --import tsx \
            tests/unit/checkout-payment-state.spec.ts \
            tests/unit/mensalidades-preview.spec.ts \
            tests/unit/rematricula-debt.spec.ts \
            tests/unit/raa-progression.spec.ts \
            tests/unit/academic-year-context.spec.ts \
            tests/unit/k12-role-inheritance.spec.ts \
            tests/unit/super-admin-role-assignment.spec.ts \
            tests/unit/aluno-boletim-scope.spec.mjs \
            tests/unit/aluno-boletim-payment-gate.spec.mjs \
            tests/unit/activity-feed-security.spec.ts \
            tests/unit/auth-cookie-session-contract.spec.ts \
            tests/unit/receipt-access-http.spec.ts \
            tests/unit/shared-contextual-notices.spec.ts \
            tests/unit/aluno-dashboard-editorial.spec.ts \
            tests/unit/aluno-notas-editorial.spec.ts
