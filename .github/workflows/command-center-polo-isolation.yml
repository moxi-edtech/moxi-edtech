name: Command Center Polo Isolation P0
on:
  pull_request:
    paths:
      - '.github/workflows/command-center-polo-isolation.yml'
      - 'apps/web/src/app/api/escolas/**/command-center/**'
      - 'apps/web/src/lib/command-center/school-wide-scope.ts'
      - 'apps/web/tests/unit/command-center-polo-isolation.spec.ts'
      - 'supabase/migrations/20271022141000_command_center_schoolwide_polo_barrier.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec tsx --test tests/unit/command-center-polo-isolation.spec.ts
      - run: pnpm -C apps/web typecheck

  postgres-rls-rpc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cc_polo_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable database and exercise real SQL authorization
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cc_polo_fixture;'
          psql "$CC_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/ops/tests/regression_command_center_polo_scope_p0.sql
