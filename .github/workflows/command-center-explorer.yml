name: Command Center Explorer
on:
  pull_request:
    paths:
      - 'apps/web/src/components/CommandPalette.tsx'
      - 'apps/web/src/components/secretaria/command-center/**'
      - 'apps/web/src/hooks/useCourseContext.ts'
      - 'apps/web/src/hooks/useTurmaContext.ts'
      - 'apps/web/src/hooks/useProfessorContext.ts'
      - 'apps/web/src/hooks/useDisciplinaContext.ts'
      - 'apps/web/src/hooks/useClasseContext.ts'
      - 'apps/web/src/lib/command-center/**'
      - 'apps/web/src/app/api/escolas/**/command-center/**'
      - 'apps/web/tests/unit/turma-explorer-policy.spec.ts'
      - 'apps/web/tests/unit/professor-contextual-explorer.spec.ts'
      - 'apps/web/tests/unit/disciplina-contextual-explorer.spec.ts'
      - 'apps/web/tests/unit/classe-contextual-explorer.spec.ts'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - 'supabase/migrations/*command_center*'
      - '.github/workflows/command-center-explorer.yml'
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-key-no-real-session
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web typecheck
      - name: Focused ESLint
        run: |
          pnpm -C apps/web exec eslint \
            src/components/CommandPalette.tsx \
            src/components/secretaria/command-center/CourseContextView.tsx \
            src/components/secretaria/command-center/TurmaContextView.tsx \
            src/components/secretaria/command-center/ProfessorContextView.tsx \
            src/components/secretaria/command-center/DisciplinaContextView.tsx \
            src/components/secretaria/command-center/ClasseContextView.tsx \
            src/components/secretaria/command-center/DisciplinaSearchResults.tsx \
            src/hooks/useCourseContext.ts \
            src/hooks/useTurmaContext.ts \
            src/hooks/useProfessorContext.ts \
            src/hooks/useDisciplinaContext.ts \
            src/hooks/useClasseContext.ts \
            src/lib/command-center \
            "src/app/api/escolas/[id]/command-center/professores/[professorId]/route.ts" \
            "src/app/api/escolas/[id]/command-center/disciplinas/route.ts" \
            "src/app/api/escolas/[id]/command-center/disciplinas/[disciplinaId]/route.ts" \
            "src/app/api/escolas/[id]/command-center/classes/[classeId]/route.ts" \
            tests/unit/professor-contextual-explorer.spec.ts \
            tests/unit/disciplina-contextual-explorer.spec.ts \
            tests/unit/classe-contextual-explorer.spec.ts --max-warnings 0
      - name: Unit contracts
        run: pnpm -C apps/web exec tsx --test tests/unit/turma-explorer-policy.spec.ts tests/unit/professor-contextual-explorer.spec.ts tests/unit/disciplina-contextual-explorer.spec.ts tests/unit/classe-contextual-explorer.spec.ts
      - run: pnpm -C apps/web build
