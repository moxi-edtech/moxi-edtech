name: AUD P1 Grade Reopening Security
on:
  pull_request:
    paths:
      - "supabase/migrations/20271118100000_audit_grade_reopen_subject_resolution.sql"
      - "supabase/migrations/20271118101000_grade_reopen_rls_guard.sql"
      - "supabase/ops/tests/audit_grade_reopening.sql"
      - "apps/web/src/app/api/professor/notas/reabertura/**"
      - "apps/web/src/app/api/secretaria/notas/reabertura/**"
      - "apps/web/tests/unit/audit-grade-reopening-contract.spec.ts"
      - ".github/workflows/audit-grade-reopening-security.yml"
permissions:
  contents: read
jobs:
  postgres:
    name: Two schools, real RLS, approval, grade write and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run actual migrations and RLS transaction flow with synthetic users
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/audit_grade_reopening.sql
  web:
    name: Reopening contracts and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test --import tsx apps/web/tests/unit/audit-grade-reopening-contract.spec.ts
      - run: pnpm -C apps/web typecheck
