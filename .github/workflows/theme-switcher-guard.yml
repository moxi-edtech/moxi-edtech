name: Theme Switcher Guard
on:
  pull_request:
    paths:
      - "apps/web/src/app/**"
      - "apps/web/src/components/**"
      - "packages/design-tokens/src/**"
      - "scripts/check-theme-switcher-colors*.mjs"
      - "apps/web/tests/unit/theme-color-coverage.spec.mjs"
      - "apps/web/src/app/layout.tsx"
      - "apps/web/src/app/theme-print.css"
      - "apps/web/src/components/ThemeToggle.tsx"
      - "apps/web/src/components/financeiro/**"
      - "apps/web/src/components/layout/escola-admin/**"
      - "apps/web/src/components/layout/operacoes/**"
      - "apps/web/src/components/super-admin/**"
      - "apps/web/tests/unit/admin-theme-coverage.spec.mjs"
      - "apps/web/src/components/ThemePreferences.tsx"
      - "apps/web/src/components/layout/klasse/Topbar.tsx"
      - "apps/web/src/components/layout/PortalLayout.tsx"
      - "apps/web/src/components/layout/klasse/ModuleSwitcher.tsx"
      - "apps/web/tests/unit/module-switcher-removal.spec.mjs"
      - "apps/web/src/components/providers/ThemeProvider.tsx"
      - "apps/web/src/lib/theme-preference.ts"
      - "apps/web/tests/unit/theme-preference.spec.ts"
      - "apps/web/package.json"
      - ".github/workflows/theme-switcher-guard.yml"
  workflow_dispatch:

jobs:
  theme-preference:
    name: Theme preference tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test:unit:theme
      - run: node --test apps/web/tests/unit/visual-contrast.spec.mjs
      - run: node --test apps/web/tests/unit/module-switcher-removal.spec.mjs
      - run: node --test apps/web/tests/unit/admin-theme-coverage.spec.mjs
      - run: node --test apps/web/tests/unit/theme-color-coverage.spec.mjs
      - run: node --test scripts/check-theme-switcher-colors.test.mjs
      - name: Guard new hardcoded UI colors
        env:
          THEME_GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: node scripts/check-theme-switcher-colors.mjs
