name: RAA Historic Documentary Bridge
on:
  pull_request:
    paths:
      - "supabase/migrations/20271109010000_raa_historico_documental_ratificado.sql"
      - "supabase/migrations/20271109015000_balcao_rematricula_fora_prazo_individual.sql"
      - "supabase/migrations/20271109020000_rematricula_preserva_origem_legal_fechada.sql"
      - "supabase/migrations/20271109030000_balcao_notas_historicas_individuais.sql"
      - "supabase/migrations/20271112010000_balcao_historic_full_staff_permissions.sql"
      - "supabase/migrations/20271112020000_balcao_primary_secondary_6_to_7.sql"
      - "supabase/migrations/20271112030000_balcao_pauta_corrigir_turma_origem.sql"
      - "supabase/migrations/20271112040000_balcao_retificacao_classe_sem_progressao.sql"
      - "supabase/migrations/20271112050000_balcao_percurso_academico.sql"
      - "supabase/migrations/20271112060000_balcao_secretaria_role_aliases.sql"
      - "supabase/ops/tests/balcao_exceptional/**"
      - "supabase/ops/tests/raa_historico/**"
      - "apps/web/src/app/api/secretaria/operacoes-academicas/reconciliacao-historica/**"
      - "apps/web/src/components/secretaria/BalcaoHistoricalAcademicRecovery.tsx"
      - "apps/web/tests/unit/raa-historical-*.spec.ts"
      - ".github/workflows/raa-historico-documental.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  documentary-raa:
    name: Authorized historical outcomes in disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: raa_historico_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d raa_historico_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/raa_historico_test
    steps:
      - uses: actions/checkout@v4
      - name: Load minimal synthetic academic-year fixture and migration
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/raa_historico/fixture.sql
      - name: Verify RAA, exact roles, audit, legal lock and school isolation
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/raa_historico/regression.sql

  historic-grade-and-late-renewal:
    name: Historical real grades + individual late enrollment in PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: exceptional_ops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d exceptional_ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/exceptional_ops_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped SQL to disposable database
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_exceptional/fixture.sql
      - name: Verify real notes, one-student audit and late-window permissions
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_exceptional/regression.sql

  historic-staff-permissions:
    name: Balcão historic role grants — synthetic PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: balcao_staff_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d balcao_staff_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/balcao_staff_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply real installed bridge and approved staff-role migration
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/raa_historico/staff_permissions_fixture.sql
      - name: Test each authorized role, ratification audit and cross-tenant denial
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/raa_historico/staff_permissions_regression.sql

  percurso:
    name: Balcão — three years, full grade entry, debt and audited outcome
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: balcao_percurso_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d balcao_percurso_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/balcao_percurso_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply actual migrations in a disposable school
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/raa_historico/percurso_fixture.sql
      - name: Verify sequence, complete notes, financial and tenant guards
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/raa_historico/percurso_regression.sql

  primary-secondary-bridge:
    name: Balcão 6th to 7th class — synthetic PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: balcao_transition_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d balcao_transition_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/balcao_transition_test
    steps:
      - uses: actions/checkout@v4
      - name: Load the actual audited 6th-primary to 7th-secondary writer upgrade
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_exceptional/primary_secondary_bridge_fixture.sql
      - name: Verify reservation, completion, no skipped classes and tenant isolation
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_exceptional/primary_secondary_bridge_regression.sql
  physical-pauta-source:
    name: Balcão physical pauta source — synthetic PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pauta_source_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pauta_source_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:5432/pauta_source_test
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact audited source-turma correction and physical pauta fixture
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_exceptional/physical_pauta_source_fixture.sql
      - name: Verify the secretary, unchanged grades, audit and cross-school denial
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/ops/tests/balcao_exceptional/physical_pauta_source_regression.sql
